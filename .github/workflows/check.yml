name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/pongbench.js suites
      - run: node bin/pongbench.js run --config mock-noisy --quick --no-save
      - name: launchers and Python examples parse
        if: runner.os != 'Windows'
        run: |
          sh -n start-pongbench.sh
          sh -n Start-PongBench.command
          test -x start-pongbench.sh && test -x Start-PongBench.command && test -x bin/pongbench.js
          python3 -m py_compile examples/python/hf_server.py examples/python/systemone_server.py
